<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="월별 어필리에이트 수익 현황을 확인합니다.">
<title>수익 현황 | LFmall</title>
<!-- Apps Script 왕복(2~4초) 중 TLS 핸드셰이크 비용을 미리 치른다.
     dns-prefetch 는 preconnect 미지원 브라우저용 폴백이다. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<!-- 폰트 파일은 CORS 로 받으므로 crossorigin 커넥션도 미리 연다. (없으면 커넥션이 2번 열린다) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/affiliate.css">
</head>
<body>

<!-- 화면 전체 뼈대는 js/common.js 가 렌더링합니다. (디바이스 목업 없음 / 반응형 웹) -->
<div class="app" id="app"></div>
<noscript><p style="padding:24px;font-size:15px">이 페이지는 JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를 허용해 주세요.</p></noscript>

<!-- 로드 순서 : site-config.js(경로) → auth.js(세션) → icons.js → common.js(공통 UI/가드) → data.js(스토어) → 화면 스크립트 -->
<script src="js/site-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/icons.js"></script>
<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script src="js/revenue.js"></script>
</body>
</html>
