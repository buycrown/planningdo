<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFmall 어필리에이트 로그인</title>
<!--
  이 문서는 '로컬에서 04_로그인 폴더를 index.html 로 열었을 때' 를 위한 리다이렉트 문서입니다.

  [왜 필요한가]
    배포(GitHub Pages) 에서는 04_로그인/login.html 이 /contents/aff/aff_login/index.html
    으로 이름이 바뀌어 올라갑니다. 로컬에는 login.html 만 있어 index.html 로 접근하면
    디렉터리 목록이나 404 가 떴습니다. 양쪽 어디로 들어와도 로그인 화면이 뜨도록
    같은 폴더의 login.html 로 즉시 보냅니다.

  ⚠️ 배포 시 주의
    aff_login/index.html 은 'login.html 의 내용' 으로 덮어써야 합니다.
    (이 리다이렉트 문서를 그대로 올리면 login.html 이 없어 404 가 됩니다)
    자세한 절차는 공용_서버_문서/QA_체크리스트.md 의 '배포 후 필수 확인' 참고.
-->
<meta http-equiv="refresh" content="0; url=login.html">
<link rel="canonical" href="login.html">
<script>location.replace('login.html');</script>
<style>body{font-family:'Malgun Gothic',sans-serif;padding:24px;font-size:15px;color:#222}</style>
</head>
<body>
  로그인 화면으로 이동합니다. 자동으로 이동하지 않으면 <a href="login.html">여기를 눌러 주세요</a>.
</body>
</html>
